<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#302a32">
  <title>三款紙偶提案｜街角的決策智慧</title>
  <link rel="icon" href="art/mark.svg">
  <link rel="stylesheet" href="folio/css/art-directions.css">
</head>
<body>
  <header class="studio-bar"><a href="./#home"><img src="art/mark.svg" width="29" height="29" alt="">街角的決策智慧</a><a href="./#home">← 返回選關地圖</a></header>
  <main class="studio">
    <div class="studio-heading"><div><p class="overline">決策智慧 2026 · 美術提案</p><h1>三款街坊紙偶</h1></div><p>同一隻端茶的石虎，同一場跳不上高凳的舞獅。選一款，看這個街區怎麼動起來。</p></div>
    <nav id="directions" aria-label="選一款美術提案"></nav>
    <div class="compare-tools"><a href="?view=compare">把三款放在一起看 ↗</a></div>
    <section class="worktable" aria-labelledby="direction-title">
      <div class="scene-block">
        <div class="stage-window" id="preview-stage" aria-busy="true"></div>
        <div class="stage-controls"><span>第 09 幕 · 舞獅廟埕</span><button id="try-jump" type="button" disabled>▷ 試跳一次</button></div>
        <p id="stage-meaning" aria-live="polite" aria-atomic="true"></p>
      </div>
      <div class="art-notes">
        <p class="overline" id="direction-code"></p><h2 id="direction-title"></h2><p class="central-idea" id="direction-idea"></p>
        <dl><dt>角色怎麼認</dt><dd id="direction-character"></dd><dt>動作怎麼讀</dt><dd id="direction-motion"></dd></dl>
        <div class="ink-strip" id="swatches" aria-label="本案主色"></div>
      </div>
    </section>
    <section class="cast-section" aria-labelledby="cast-title"><div class="section-head"><h2 id="cast-title">街坊角色</h2><span id="cast-family"></span></div><div id="cast-row"></div></section>
    <section class="world-section" aria-labelledby="world-title"><div class="section-head"><h2 id="world-title">四個街區，十二件道具</h2><span>點道具，看它怎麼說故事</span></div><div id="worlds"></div>
      <article id="prop-sample" aria-live="polite"><div class="enlarged-prop"></div><div><span class="overline" id="prop-level"></span><h3 id="prop-title"></h3><p id="prop-action"></p><p id="prop-treatment"></p></div></article>
    </section>
    <footer class="studio-foot"><p>造型觀察取自《The Folded Atlas》的圖書館頁。耳形、頰色和拿在手裡的物件，在遠景也讀得出角色的意圖。<a href="https://rosy-wisdom-dw86.here.now/#library">參考作品 ↗</a></p><a href="./#home">回到十二關的選關地圖 →</a></footer>
  </main>
  <script type="module" src="folio/js/art-directions.js"></script>
</body>
</html>
