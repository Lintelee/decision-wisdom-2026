<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eddc">
  <title>巡燈員一眨・三款紙偶試樣｜街角的決策智慧</title>
  <link rel="stylesheet" href="proof.css">
</head>
<body>
<main>
  <header>
    <div>
      <p class="imprint">街角的決策智慧 <span>／</span> 紙偶試樣</p>
      <h1>巡燈員一眨</h1>
      <p class="intro">這是巡燈員一眨早期試演的三款紙偶。當時選了 B 款雙層摺面。讓一眨和改衣師點點站在一起，就能比較兩個角色的摺痕和紙邊。</p>
    </div>
    <fieldset>
      <legend>紙偶觀看角度</legend>
      <label><input type="radio" name="angle" value="front" checked><span>看正面</span></label>
      <label><input type="radio" name="angle" value="edge"><span>看斜側</span></label>
    </fieldset>
  </header>
  <section class="choices" aria-label="三款剪紙設計">
    <article>
      <div class="label"><span class="letter">A</span><h2>一片剪影</h2></div>
      <div class="pair">
        <img class="front" src="a-front.webp" width="1050" height="690" alt="A 款正面。平剪的米白身形，紫色單眼和橫向腰線清楚可見，旁邊是樹蛙點點。">
        <img class="edge" src="a-edge.webp" width="1050" height="690" alt="A 款斜側。肩、手和眼罩各是一張薄卡，胸腹連成一片。">
      </div>
      <p class="note">胸腹共用一片米白色卡，腰線用墨色印上。抬手時，黑紙手指從身體輪廓探出來。</p>
      <figure><img src="a-street.webp" width="458" height="254" alt="A 款站在舞獅左邊，正舉手看排練。"><figcaption>廟埕排練場</figcaption></figure>
    </article>
    <article>
      <div class="label"><span class="letter">B</span><h2>雙層摺面</h2></div>
      <div class="pair">
        <img class="front" src="b-front.webp" width="1050" height="690" alt="B 款正面。胸腹有寬摺面，單眼外多一圈牛皮紙，和點點的眼眶相呼應。">
        <img class="edge" src="b-edge.webp" width="1050" height="690" alt="B 款斜側。下腹疊在胸片前，鏡框露出一圈暖色紙邊。">
      </div>
      <p class="note">把下腹另剪一片，輕摺出明暗。單眼鑲一圈牛皮紙，與點點的眼眶用同一種剪法。</p>
      <figure><img src="b-street.webp" width="458" height="254" alt="B 款在同一位置看排練，縮小後仍能看出眼框與腹部的摺面。"><figcaption>廟埕排練場</figcaption></figure>
    </article>
    <article>
      <div class="label"><span class="letter">C</span><h2>分片拼貼</h2></div>
      <div class="pair">
        <img class="front" src="c-front.webp" width="1050" height="690" alt="C 款正面。額頭與腹側多了幾片色紙，肩肘和膝蓋有圓形紙鉚釘。">
        <img class="edge" src="c-edge.webp" width="1050" height="690" alt="C 款斜側。可辨認雙圈鏡框、右腹插舌和紙袖的接合處。">
      </div>
      <p class="note">在額頭與腹側再拼幾片紙。鏡頭有內外兩圈，手肘、膝蓋露出小紙鉚釘。</p>
      <figure><img src="c-street.webp" width="458" height="254" alt="C 款在同一位置看排練，紙片拼接集中在眼框與肩部。"><figcaption>廟埕排練場</figcaption></figure>
    </article>
  </section>
  <footer>
    <details>
      <summary>對照改版前的機器人</summary>
      <img src="earlier-street.webp" width="458" height="254" alt="改版前的一眨站在廟埕，身體是多片放射狀紙瓣組成的圓殼。">
    </details>
    <a href="../../#game/friction">翻到廟埕這一頁</a>
  </footer>
</main>
</body>
</html>
