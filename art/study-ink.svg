  <title id="i9-title">街坊印舖 · 舞獅廟埕</title>
  <desc id="i9-desc">朱紅的前腳印和靛藍的後腳印錯開。獅頭跳向長凳，後腳才踩下第一拍；地上的印記讓人看見兩雙腳各走了多遠。</desc>
