  <title id="f9-title">巷口摺紙偶 · 舞獅廟埕</title>
  <desc id="f9-desc">攤開的紙本上，兩位街坊撐起同一頭舞獅。前腳朝長凳躍去，後腳晚了一拍，兩人之間的紙褶拉開又折回。</desc>
