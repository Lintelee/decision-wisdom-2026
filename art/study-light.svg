  <title id="l9-title">窗燈小戲班 · 舞獅廟埕</title>
  <desc id="l9-desc">暖黃窗紙後照出獅頭與獅尾的影子。獅頭先跳向凳邊，獅尾還在地上，錯開的剪影將兩位街坊的步伐照得清清楚楚。</desc>
